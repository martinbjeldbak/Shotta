---
name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions: read-all
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Clear Libs folder. It will be created from scratch
        run: |
          rm -rf Libs/

      # Immutable releases refuse assets once a release is published, and the packager
      # publishes before it uploads. Pre-creating the release as a draft keeps it mutable
      # until the packager does its PATCH (which publishes it) + uploads.
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it alone."
            exit 0
          fi
          notes=$(git log --reverse --no-merges --pretty=format:'- %s' "$(git describe --tags --abbrev=0 "HEAD~")"..HEAD)
          heading=$(awk -F': ' '/^## Title:/ { print $2 }' Shotta.toc)
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$heading

          ## $GITHUB_REF_NAME

          $notes"

      - name: Package and release
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOW_INTERFACE_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_KEY }}

      - name: Shotta Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@d2594079a10f1d6739ee50a2471f0ca57418b554 # 0.4.0
        with:
          args: |
            A new Shotta **release [${{ github.ref_name }}](https://github.com/martinbjeldbak/Shotta/releases/tag/${{ github.ref_name }})** is live! <@&1225515623094947850>
